const copy={"zh": {"title": "从研究计划，走到可复核的实验", "lead": "范润堃已提交 Fed-ISIC 第二、三轮实验。新的重点是：记录真实进展，也如实保留没有成功的尝试。", "status": "2026-11-03 · 成员提交 · 待人类复核 · 尚未合并研究 main", "scope": "本页公开工作进展与方法变化。具体性能数值、逐次日志及未公开实验材料继续留在私有研究库。本次网页更新没有重新训练模型或独立复现实验。", "back": "返回研究介绍", "tour": "进入公众互动讲解", "nowTitle": "现在走到了哪一步？", "stages": [["已提交", "01 · 流程预试验", "PathMNIST 第一轮只保留为流程验证，不再作为主研究效果证据。"], ["已提交", "02 · Fed-ISIC 对照实验", "报告包含 B0、B2、B3 与 P1 的多种子实验，比较类别表现与 DP 代价；主数据使用 FLamby 六客户端划分。"], ["已提交", "03 · 第二阶段与修正尝试", "已记录 P2、P2-PCA、P2-LA、预算探索及失败诊断，不能把“实现了”写成“解决了”。"], ["待完成", "04 · 扩展与独立复核", "B5、胸片训练、MIA，以及最后一个 block 与分类头共同微调的 P1 尚未完成；成员复核人仍待确定。"]], "findingTitle": "目前报告了什么？", "findings": [["RQ1 · 本配置下有支持性观察", "提交者报告：DF/VASC 这两个少样本类别的 DP 代价大于常见类 NV。该观察来自当前公开数据模拟和固定配方，不是对所有罕见病的普遍结论。"], ["RQ2 · 尚不能宣称方案成功", "原版 P2 未显示稳定收益。P2-PCA 的不同类别表现有升有降，不能只挑一个改善指标。P2-LA 仅报告有限改善，仍需复核及更强对照。"], ["RQ3 · 更广泛验证仍待推进", "胸片训练与分布变化的完整验证尚未完成；现有结果不代表临床有效、跨医院泛化成立或课程目标全部达成。"]], "variantTitle": "三个名称，并不是同一个方法", "variantLead": "点按查看“原方案—修正方案”的区别。以下为成员报告的阶段性解释，不是新生成的模拟指标。", "variants": {"P2": ["P2 · 受保护的特征和与计数", "在第一阶段模型之上，发布 DP 类别特征和、计数，再构造均衡虚拟特征重训分类器。报告中未得到稳定收益；对少样本类别，高维加噪摘要可能过于不稳定。"], "P2-PCA": ["P2-PCA · 先公开降维，再做摘要", "用经过测试集重叠排查的公开 Derma 特征拟合 PCA，再在低维空间执行第二阶段。报告中部分罕见类指标上升，但类别间表现及整体效果不一致，不能据此宣布成功。"], "P2-LA": ["P2-LA · 用受保护计数调整预测分数", "不发布第二阶段特征和，也不生成虚拟特征重训分类器；使用 DP 类别计数调整第一阶段预测分数。报告为有限改善，且各方法的实际累计 ε 不完全相同，不能称为同一实际 ε 的严格比较。"]}, "changeTitle": "原设计与本轮实现，需要分开读", "changes": [["P1 的范围", "本轮使用固定 ImageNet 特征，只用 DP 训练分类头；不是原计划中最后一个 block / LoRA 与分类器的完整微调。"], ["B4 的定义", "本轮 B4 是 P1 加类别权重，不等于旧研究设计表中的 B3 加权。阅读对比时必须先核对实现。"], ["BatchNorm", "本轮报告采用固定 ImageNet 统计量的 BatchNorm（eval），并非统一替换 GroupNorm；模块兼容性及隐私前提仍需技术复核。"], ["数据使用", "报告称 DermaMNIST 仅用于选参，并剔除了与 ISIC 测试图像的重叠；NIH ChestX-ray14 完成准备，但本轮未用于训练。"], ["关口与失败", "B3 seed0 未达到原定继续关口。提交记录说明在保留原配方的情况下补齐种子，并保留这一偏离与失败记录；不能当作已通过关口。"]], "privacyTitle": "隐私声明仍有哪些边界？", "privacy": "报告采用图像/样本级 DP 与 RDP 会计，不是已经证明的患者级 DP。ε≤3 是逐模型预算上限的实验设置，方法间实际累计 ε 不完全相同；它也不自动覆盖所有配置、重复种子与调参的总体发布。应继续复核保护单位、客户端间患者重叠、统计发布组合和完整发布范围。", "nextTitle": "下一步的责任", "next": "建议郭津阳复核 DP 会计和二阶段组合，张皓复核评价与测试集使用，范润堃保留可复现配置与失败记录，金銀潔复核研究问题和三语含义。这是后续复核建议，不是已获批准或已经完成的评审。", "sourceTitle": "可追溯的依据", "sourceText": "核对范围：分支与作者、固定提交的报告、方法对照 CSV、类别 DP 代价 CSV、决定记录、运行说明与第三轮回报。核对文件之间的一致性不等于独立复现全部训练。", "report": "私有实验报告（需协作者登录）", "review": "私有实现与限制记录（需登录）", "log": "本次三语修改记录", "footer": "研究设计第二版仍作为原始计划保留。最新进展应以本页日期和固定提交为准；历史网页未改写。", "homeTitle": "11月3日更新：Fed-ISIC 实验已提交，待复核", "homeCopy": "新增第二、三轮实验及 P2 修正尝试。原方案尚未显示稳定收益，公开页展示进展与限制。", "cta": "查看最新进展 →", "notice": "研究设计 v2 + 11月3日成员实验进展。范润堃已提交 Fed-ISIC 第二、三轮工作；仍待人类复核，本次网页更新未重新训练或独立复现实验。", "fanRole": "已提交 Fed-ISIC 第二、三轮实验、数据划分与失败诊断；继续负责数据许可、重复审计及基线复现。PathMNIST 仅保留为流程验证。", "progressNote": "金銀潔的设计书保留为原始计划。范润堃已提交 member/fanrunkun1/round2-3-fedisic（84ab6a2），包含对照实验及 P2/PCA/LA 尝试；本轮 P1 仅训练分类头，B4 为 P1 加权。尚待人类复核，详细数值和逐次日志留在私有研究库。", "tourStatus": "研究计划与阶段进展 · 11月3日已提交实验、待人类复核。下面的点、噪声和流程仍为概念示意，没有真实患者数据，也不是临床工具。", "tourIdeas": "原设计的两个思路，以及本轮的检验", "tourIdeasLead": "下面解释原设计 P1/P2。新提交已测试分类头版 P1 及 P2/PCA/LA，尚不能宣称稳定改善；实际实现与原设计的差别见最新进展。", "tourEvidence": "实验已开始，结论仍要接受复核", "tourEnd": "我们已从计划进入 Fed-ISIC 实验阶段。当前报告保留了失败与有限改善，下一步是技术复核和补充验证。"}, "en": {"title": "From a research plan to experiments that can be reviewed", "lead": "Fan Runkun has submitted Fed-ISIC rounds 2–3. The focus is to document progress while retaining unsuccessful attempts honestly.", "status": "2026-11-03 · Member submission · Human review pending · Not merged into research main", "scope": "This page shares progress and method changes. Detailed performance values, per-run logs and unpublished experimental material remain in the private research repository. This website update did not retrain models or independently reproduce experiments.", "back": "Back to research overview", "tour": "Open the interactive explainer", "nowTitle": "Where are we now?", "stages": [["Submitted", "01 · Pipeline pilot", "The first PathMNIST round remains a pipeline check, not evidence for the main study’s utility claims."], ["Submitted", "02 · Fed-ISIC comparisons", "The report contains multi-seed B0, B2, B3 and P1 runs, comparing class performance and DP costs on FLamby’s six-client partition."], ["Submitted", "03 · Stage two and revisions", "P2, P2-PCA, P2-LA, budget exploration and failure diagnoses are recorded. Implementing an idea does not mean solving the problem."], ["Pending", "04 · Extensions and independent review", "B5, chest-image training, MIA and a P1 variant tuning the last block plus classifier are unfinished. Human reviewers have not yet been assigned."]], "findingTitle": "What has been reported so far?", "findings": [["RQ1 · Supporting observations in this configuration", "The submitter reports larger DP costs for the low-sample DF/VASC classes than for common NV. This is an observation from the current public-data simulation and fixed recipe, not a universal rare-disease conclusion."], ["RQ2 · Success is not established", "Original P2 showed no stable benefit. P2-PCA changed different classes in different directions; one improved metric is insufficient. P2-LA reports limited gains that still require review and stronger controls."], ["RQ3 · Broader validation remains", "Chest-image training and complete distribution-shift validation are unfinished. The current work does not establish clinical benefit, cross-hospital generalization or completion of all course targets."]], "variantTitle": "Three names, three different methods", "variantLead": "Select a method to distinguish the original proposal from revisions. These are interpretations of the submitted report, not newly simulated metrics.", "variants": {"P2": ["P2 · Protected feature sums and counts", "Release DP class feature sums and counts on top of stage one, construct balanced virtual features and retrain the classifier. The report shows no stable benefit; high-dimensional noisy summaries can be unstable for low-sample classes."], "P2-PCA": ["P2-PCA · Public dimensionality reduction first", "Fit PCA on public Derma features after checking test-image overlap, then perform stage two in a lower-dimensional space. Some rare-class metrics rose, but class-specific and overall outcomes were inconsistent; this does not establish success."], "P2-LA": ["P2-LA · Adjust scores using protected counts", "No second-stage feature sums or virtual-feature classifier retraining. DP class counts adjust stage-one prediction scores. Reported gains are limited. Actual composed ε differs across methods, so this is not a strict equal-actual-ε comparison."]}, "changeTitle": "Read the original design separately from this implementation", "changes": [["P1 scope", "This round freezes ImageNet features and trains only a classifier head with DP. It does not implement the full planned last-block/LoRA-plus-classifier fine-tuning."], ["B4 definition", "Here B4 is class-weighted P1, rather than class-weighted B3 in the earlier design table. Verify the implementation before interpreting comparisons."], ["BatchNorm", "The reported recipe freezes ImageNet BatchNorm statistics in eval mode rather than replacing all BatchNorm with GroupNorm. Module compatibility and privacy assumptions still need technical review."], ["Data use", "The report says DermaMNIST was used only for selection, with ISIC test-image overlaps removed. NIH ChestX-ray14 was prepared but not used for training in this round."], ["Gate and failures", "B3 seed0 did not pass the planned continuation gate. Records describe completing the remaining seeds with the fixed recipe, while retaining the deviation and failure. This must not be described as a passed gate."]], "privacyTitle": "What privacy boundaries remain?", "privacy": "The report uses image/sample-level DP and RDP accounting, not proven patient-level DP. ε≤3 is the per-model experimental cap; actual composed ε differs across methods. It does not automatically cover the combined release of all configurations, repeated seeds and tuning. Protection units, patient overlap, statistical-release composition and the complete release scope still need review.", "nextTitle": "Who reviews next?", "next": "Suggested next steps: Guo Jinyang reviews accounting and stage-two composition; Zhang Hao reviews evaluation and test-set use; Fan Runkun retains reproducible configurations and failures; Kim eungyeul reviews research questions and trilingual meaning. These are proposed responsibilities, not completed or approved reviews.", "sourceTitle": "Traceable evidence", "sourceText": "Checked: branch and author, fixed-commit report, method-comparison CSV, class DP-cost CSV, decision record, run guide and round-three write-up. Cross-checking files is not independent reproduction of all training.", "report": "Private experiment report (collaborator sign-in)", "review": "Private implementation and limitations (sign-in)", "log": "Trilingual update log", "footer": "Research design v2 is retained as the original plan. Read current progress against this page’s date and fixed commit. Historical pages were not rewritten.", "homeTitle": "Nov 3 update: Fed-ISIC experiments submitted for review", "homeCopy": "Rounds 2–3 and P2 revisions have been submitted. Stable benefits of the original proposal are not established; view progress and limitations.", "cta": "Read the latest progress →", "notice": "Research design v2 + Nov 3 member progress. Fan Runkun has submitted Fed-ISIC rounds 2–3; human review is pending. This website update did not retrain models or independently reproduce experiments.", "fanRole": "Submitted Fed-ISIC rounds 2–3, data partitions and failure diagnoses. Continues data-permission, duplication-audit and baseline work. PathMNIST remains a pipeline check only.", "progressNote": "Kim eungyeul’s design remains the original plan. Fan Runkun submitted member/fanrunkun1/round2-3-fedisic (84ab6a2), including comparisons and P2/PCA/LA attempts. This round uses head-only P1 and class-weighted P1 as B4. Human review is pending; detailed values and per-run logs remain private.", "tourStatus": "Research plan and interim progress · Experiments submitted Nov 3; human review pending. The dots, noise and flows below remain conceptual illustrations. No real patient data; not a clinical tool.", "tourIdeas": "Two original ideas, now being tested", "tourIdeasLead": "Below is the original P1/P2 design. The new submission tests head-only P1 and P2/PCA/LA; stable improvement is not established. See the latest progress for implementation differences.", "tourEvidence": "Experiments have started. Conclusions still need review.", "tourEnd": "We have moved from planning to Fed-ISIC experiments. The report retains failures and limited gains; technical review and further validation come next."}, "ko": {"title": "연구 계획에서 검토 가능한 실험으로", "lead": "范润堃이 Fed-ISIC 2–3차 실험을 제출했습니다. 실제 진행 상황과 함께 성공하지 못한 시도도 정직하게 기록합니다.", "status": "2026-11-03 · 구성원 제출 · 사람의 검토 대기 · 연구 main 미병합", "scope": "이 페이지는 진행 상황과 방법 변경을 공개합니다. 상세 성능 수치·실행별 로그·미공개 실험 자료는 비공개 연구 저장소에 보관합니다. 이번 웹 업데이트에서 모델 재학습이나 독립 재현은 수행하지 않았습니다.", "back": "연구 소개로 돌아가기", "tour": "대중 인터랙티브 설명 보기", "nowTitle": "지금 어디까지 왔나요?", "stages": [["제출됨", "01 · 파이프라인 예비 점검", "PathMNIST 1차 작업은 파이프라인 점검으로 보존하며 주 연구 성능의 근거로 사용하지 않습니다."], ["제출됨", "02 · Fed-ISIC 비교 실험", "보고서에는 B0·B2·B3·P1의 여러 seed 실험과 클래스별 성능·DP 비용 비교가 있습니다. FLamby 6개 클라이언트 분할을 사용합니다."], ["제출됨", "03 · 2단계 방법과 수정 시도", "P2·P2-PCA·P2-LA, 예산 탐색과 실패 진단이 기록되었습니다. 구현했다는 사실이 해결했다는 뜻은 아닙니다."], ["미완료", "04 · 확장과 독립 검토", "B5·흉부 영상 학습·MIA·마지막 block과 분류기를 함께 조정하는 P1은 미완료입니다. 사람 검토자도 아직 지정되지 않았습니다."]], "findingTitle": "현재 무엇이 보고되었나요?", "findings": [["RQ1 · 이번 설정의 지지 관찰", "제출자는 표본이 적은 DF/VASC의 DP 비용이 흔한 NV보다 컸다고 보고합니다. 현재 공개 데이터 시뮬레이션과 고정 설정의 관찰이며 모든 희귀질환에 대한 보편 결론은 아닙니다."], ["RQ2 · 성공을 확정할 수 없음", "원래 P2는 안정적인 이득을 보이지 않았습니다. P2-PCA는 클래스마다 개선과 악화가 달랐으므로 하나의 개선 지표만 고르면 안 됩니다. P2-LA의 이득도 제한적이며 추가 검토와 대조가 필요합니다."], ["RQ3 · 폭넓은 검증은 아직", "흉부 영상 학습과 완전한 분포 변화 검증은 미완료입니다. 현재 작업은 임상 효과·병원 간 일반화·모든 수업 목표 달성을 입증하지 않습니다."]], "variantTitle": "세 이름은 서로 다른 방법입니다", "variantLead": "방법을 눌러 원안과 수정안을 구분하세요. 제출 보고서의 단계적 설명이며 새로 만든 시뮬레이션 지표가 아닙니다.", "variants": {"P2": ["P2 · 보호된 특성 합과 수", "1단계 모델에 더해 DP 클래스별 특성 합과 수를 공개하고 균형 잡힌 가상 특성으로 분류기를 재학습합니다. 보고서에서 안정적인 이득이 없었으며 적은 표본의 고차원 노이즈 요약이 불안정할 수 있습니다."], "P2-PCA": ["P2-PCA · 공개 데이터로 먼저 차원 축소", "테스트 이미지 중복을 확인한 공개 Derma 특성으로 PCA를 맞추고 저차원에서 2단계를 수행합니다. 일부 희귀 클래스 지표는 올랐지만 클래스별·전체 결과가 일관되지 않아 성공을 확정할 수 없습니다."], "P2-LA": ["P2-LA · 보호된 수로 예측 점수 조정", "2단계 특성 합 공개나 가상 특성 분류기 재학습 없이 DP 클래스 수로 1단계 예측 점수를 조정합니다. 보고된 이득은 제한적입니다. 방법마다 실제 합성 ε가 달라 동일 실제 ε의 엄격한 비교로 부를 수 없습니다."]}, "changeTitle": "원 설계와 이번 구현을 구분하세요", "changes": [["P1 범위", "이번에는 ImageNet 특성을 고정하고 분류기만 DP로 학습했습니다. 계획한 마지막 block/LoRA와 분류기의 전체 미세조정 구현이 아닙니다."], ["B4 정의", "이번 B4는 클래스 가중 P1이며 이전 설계표의 클래스 가중 B3와 다릅니다. 비교를 읽기 전에 구현을 확인해야 합니다."], ["BatchNorm", "이번 보고서는 ImageNet BatchNorm 통계를 eval 상태로 고정하며 전부 GroupNorm으로 바꾸지 않았습니다. 모듈 호환성과 프라이버시 전제는 기술 검토가 필요합니다."], ["데이터 사용", "보고서에 따르면 DermaMNIST는 선택용이며 ISIC 테스트 이미지 중복을 제거했습니다. NIH ChestX-ray14는 준비했지만 이번에 학습하지 않았습니다."], ["관문과 실패", "B3 seed0는 사전 진행 관문을 통과하지 못했습니다. 고정 설정으로 나머지 seed를 실행하고 편차·실패를 보존했다고 기록되어 있습니다. 관문 통과로 쓰면 안 됩니다."]], "privacyTitle": "프라이버시 주장의 경계는 무엇인가요?", "privacy": "보고서는 이미지/표본 수준 DP와 RDP 회계를 사용하며 환자 수준 DP를 입증한 것이 아닙니다. ε≤3은 모델별 실험 상한이고 방법마다 실제 합성 ε가 다릅니다. 모든 설정·반복 seed·튜닝의 전체 공개를 자동으로 보장하지 않습니다. 보호 단위·기관 간 환자 중복·통계 공개 합성·전체 공개 범위를 추가 검토해야 합니다.", "nextTitle": "다음 검토의 책임", "next": "권장 후속 작업: 郭津阳은 DP 회계와 2단계 합성, 张皓는 평가와 테스트셋 사용, 范润堃은 재현 가능한 설정과 실패 기록, 金銀潔 김은결은 연구 질문과 삼중언어 의미를 검토합니다. 완료되거나 승인된 검토가 아닌 후속 제안입니다.", "sourceTitle": "추적 가능한 근거", "sourceText": "확인 범위: 분기·저자, 고정 commit 보고서, 방법 비교 CSV, 클래스 DP 비용 CSV, 결정 기록, 실행 안내와 3차 회고. 파일 간 일관성 점검이 전체 학습의 독립 재현은 아닙니다.", "report": "비공개 실험 보고서 (협업자 로그인)", "review": "비공개 구현·한계 기록 (로그인)", "log": "삼중언어 변경 기록", "footer": "연구 설계 v2는 원 계획으로 보존합니다. 최신 진행은 이 페이지 날짜와 고정 commit을 기준으로 읽으세요. 역사 페이지는 수정하지 않았습니다.", "homeTitle": "11월 3일 업데이트: Fed-ISIC 실험 제출·검토 대기", "homeCopy": "2–3차 실험과 P2 수정 시도가 제출되었습니다. 원안의 안정적 이득은 아직 입증되지 않았으며 진행과 한계를 공개합니다.", "cta": "최신 진행 보기 →", "notice": "연구 설계 v2 + 11월 3일 구성원 실험 진행. 范润堃이 Fed-ISIC 2–3차 작업을 제출했으며 사람 검토를 기다립니다. 이번 웹 업데이트에서 재학습·독립 재현은 하지 않았습니다.", "fanRole": "Fed-ISIC 2–3차 실험·데이터 분할·실패 진단을 제출했습니다. 데이터 허가·중복 감사·기준선 재현을 계속 담당하며 PathMNIST는 파이프라인 점검으로만 보존합니다.", "progressNote": "김은결의 설계서는 원 계획으로 보존합니다. 范润堃이 비교 실험과 P2/PCA/LA 시도를 포함한 member/fanrunkun1/round2-3-fedisic(84ab6a2)을 제출했습니다. 이번 P1은 분류기만 학습하고 B4는 가중 P1입니다. 사람 검토 대기 상태이며 상세 수치와 실행 로그는 비공개 연구 저장소에 둡니다.", "tourStatus": "연구 계획과 단계별 진행 · 11월 3일 실험 제출·사람 검토 대기. 아래 점·노이즈·흐름은 계속 개념 설명용이며 실제 환자 데이터나 임상 도구가 아닙니다.", "tourIdeas": "두 원래 아이디어와 진행 중인 검증", "tourIdeasLead": "아래는 원래 P1/P2 설계입니다. 새 제출은 분류기만 학습하는 P1과 P2/PCA/LA를 시험했으며 안정적 개선은 확정하지 않았습니다. 설계와 구현의 차이는 최신 진행에서 확인하세요.", "tourEvidence": "실험은 시작되었고, 결론은 검토가 필요합니다", "tourEnd": "계획에서 Fed-ISIC 실험 단계로 진행했습니다. 실패와 제한적 이득을 보고했으며 다음은 기술 검토와 추가 검증입니다."}};
const state={lang:'ko',variant:'P2'};const desired=new URLSearchParams(location.search).get('lang');if(Object.hasOwn(copy,desired))state.lang=desired;
const $=id=>document.getElementById(id);
function variantRender(){const t=copy[state.lang];$('variantTitle').textContent=t.variants[state.variant][0];$('variantCopy').textContent=t.variants[state.variant][1];document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===state.variant?'true':'false'));}
function rows(id,items,staged=false){$(id).replaceChildren();for(const parts of items){const box=document.createElement('article');box.className='stage';if(staged){const flag=document.createElement('span');flag.className='flag';flag.textContent=parts[0];box.append(flag);}const h=document.createElement('h3');h.textContent=parts[staged?1:0];const p=document.createElement('p');p.textContent=parts[staged?2:1];box.append(h,p);$(id).append(box);}}
function render(){const t=copy[state.lang];document.documentElement.lang=state.lang==='zh'?'zh-CN':state.lang;document.title='MedFL · '+t.title;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===state.lang?'true':'false'));const home=state.lang==='ko'?'index.html':state.lang+'.html';$('home').href=home;$('back').href=home;$('tour').href='explain.html?lang='+state.lang;rows('stages',t.stages,true);rows('findings',t.findings);rows('changes',t.changes);variantRender();}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{state.variant=b.dataset.variant;variantRender();});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;const u=new URL(location.href);u.searchParams.set('lang',state.lang);history.replaceState(null,'',u);render();});render();
