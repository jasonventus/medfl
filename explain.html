标。'],['RQ3 · 换种分布还有效吗？','改变客户端间类别分布，保留重复实验与失败结果，检查结论是否稳定。']],recallTitle:'“召回率”是什么意思？',recall:'在确实属于某类别的样本中，模型正确找回了多少？只看整体准确率，可能掩盖样本较少类别的表现。',rareTitle:'罕见类别等于临床罕见病吗？',rareNote:'不一定。这里首先指数据集里样本较少的类别，不自动等同于临床定义的罕见病。主实验是公开皮肤病图像的联邦模拟，不能直接推断真实医院诊疗效果。',patientTitle:'是否已经证明“患者级隐私”？',patientNote:'没有。图像级 DP 不自动等于患者级 DP。需要核查患者标识、重复图像和跨客户端重叠，明确保护单位并验证会计后才能作相应声明。',quizTitle:'10秒检查：你抓住重点了吗？',quiz:'数据不离开医院，就代表绝不泄露吗？',quizA:'是，已经绝对安全',quizB:'不是，更新仍需要保护',quizGood:'对。联邦学习减少原始数据外传；更新仍可能泄露信息，需要明确的隐私机制、会计和验证。',quizWrong:'再想一步：原始数据留在本地，模型更新也可能带有信息。“不传病历”不等于“零风险”。',sourceTitle:'依据与制作说明',sourceCopy:'本页依据金銀潔的研究设计与小组现有第二版公开研究计划编写。下列官方资料用于核查联邦学习、DP-SGD 及数据划分；本页没有发布新实验结果。',toolsTitle:'这页如何由人和 AI 一起制作？',toolsCopy:'AI HUB 提供讲解分镜，Gemini 提供文案审查，WorkBuddy 提供实现检查，Muse 提供叙事建议，Canva 生成信息图草稿；Codex 筛选建议、编写并验证交互。AI 输出经过筛选，错误和夸大内容没有照搬。',logLink:'查看三语制作与修改记录',end:'我们的目标：研究隐私保护与罕见类别表现之间的权衡。是否改善，要让实验回答。',research:'查看完整研究计划 ↗',edit:'GitHub 协作入口',unit:'示意强度'},
en:{eyebrow:'PROJECT 05 / PUBLIC INTERACTIVE TOUR / ABOUT 3 MIN',title:'Can AI learn together while data stays local?',lead:'Our question: how can institutions train AI together, protect privacy, and still pay attention to underrepresented classes?',notice:'Research plan · Benefits unverified. All dots, noise and flows are conceptual illustrations. No real patient data; not a clinical tool.',nav1:'① Learn together',nav2:'② Explore the problem',nav3:'③ Test two ideas',nav4:'④ Ask for evidence',flowTitle:'Share learning updates. Keep raw data local.',flowLead:'Click through one federated training round. Three fictional hospitals explain the flow; the planned main study uses six Fed-ISIC2019 clients.',concept:'Concept illustration · Not experimental results',ha:'Fictional hospital A',hb:'Fictional hospital B',hc:'Fictional hospital C',local:'▣ Raw data stays local',server:'Coordinating server',back:'Previous',next:'Next',reset:'Start again',steps:['Send model','Learn locally','Protect updates','Aggregate'],stepTitles:['Send the current model to each hospital','Learn locally without sending records','Limit each record’s contribution, then add noise','Aggregate protected updates for the next round'],stepCopies:['The server sends model parameters, not patient records.','Each client trains using its own data. The data boxes stay at the hospitals throughout.','DP-SGD clips per-record gradient contributions and adds noise. The resulting update is sent to the server. Adding noise to an arbitrary file is not sufficient for DP.','The server combines updates according to the protocol, then redistributes the model. An updated model is not necessarily more accurate: experiments must evaluate it.'],packets:['Model parameters','Local training','Protected updates','Next-round model'],flowNote:'Keeping raw data local reduces transfers, but updates can still reveal information. Under a specified unit, adjacency definition and ε/δ budget, DP bounds how one unit changes the output distribution. It does not promise zero risk.',noiseTitle:'Could the same interference hide a quieter signal?',noiseLead:'Many circles represent a common class; fewer diamonds represent a rare class. Move the slider to explore the same visual interference. Whether rare classes are harmed more is a research question, not an established result here.',slider:'Illustrative noise intensity',low:'Low',high:'High',common:'● Common class · More signals',rare:'◆ Rare class · Fewer signals',commonLegend:'Circles mean “relatively more”, not a patient count.',rareLegend:'Diamonds mean “relatively fewer”, not a patient count.',noiseStates:['Less interference: signals in both groups are easier to see.','With the same interference, fewer diamond signals may be harder to distinguish.','Strong interference obscures both groups. Actual effects on rare classes require experiments.'],noiseNote:'The slider changes a visual overlay only. It does not run DP, train a model, estimate accuracy, or map to real ε. Counts, intensity and occlusion are intentionally illustrative.',ideasTitle:'Two ideas we plan to test',ideasLead:'Start from public knowledge, then explore a more balanced classifier. Select P1 or P2.',unverified:'Proposed method · Unverified',methods:{P1:['P1 · Adjust a few chapters, not the whole book','Start from a publicly pretrained model. Freeze most parameters and use DP fine-tuning on selected modules or low-dimensional parameters and the classifier. We hope to make learning easier; fewer trainable parameters do not automatically guarantee better results.'],P2:['P2 · Balance classes using protected summaries','On top of P1, clients release clipped and noised class feature sums and counts. The server uses these DP summaries to construct equal numbers of virtual features per class and retrain the classifier. It does not copy or invent real patient records.']},parameterNote:'Light = frozen; dark = adjusted. Block counts and proportions are illustrative, not actual model sizes.',summaryNote:'A / B / C symbols represent DP class summaries used to construct virtual features, not patient records.',budget:'Final ε≤3: planned target',effect:'Rare-class improvement: to be tested',budgetNote:'P2 statistics also consume privacy budget. All rounds and releases must be composed and verified at a fixed δ. This illustration does not calculate or prove that budget.',evidenceTitle:'Experiments must answer. An animation cannot.',questions:[['RQ1 · Is there a gap?','Compare non-DP and DP federated learning. Is the utility loss larger for rare classes?'],['RQ2 · Do the ideas help?','At the same final privacy budget and matched conditions, compare baselines, P1 and P2, including rare- and worst-class recall.'],['RQ3 · Does it hold across distributions?','Vary class distributions across clients. Retain repeated runs and failures to check whether findings are stable.']],recallTitle:'What does “recall” mean?',recall:'Among samples that really belong to a class, how many did the model correctly find? Overall accuracy alone can hide weak performance on less-represented classes.',rareTitle:'Does a rare class mean a clinical rare disease?',rareNote:'Not necessarily. Here it first means a class with fewer dataset samples. The planned main study simulates federation with public skin-lesion images; it cannot establish real hospital diagnostic performance.',patientTitle:'Have we proven patient-level privacy?',patientNote:'No. Image-level DP is not automatically patient-level DP. Patient identifiers, duplicate images and overlap across clients must be audited, and the protection unit and accounting verified.',quizTitle:'A 10-second check',quiz:'If data stays at the hospital, is leakage impossible?',quizA:'Yes, it is completely safe',quizB:'No, updates still need protection',quizGood:'Correct. Federated learning reduces raw-data transfers; updates can still reveal information. Privacy mechanisms, accounting and validation are needed.',quizWrong:'One more step: updates may carry information even when records stay local. “No raw-record transfer” does not mean “zero risk”.',sourceTitle:'Sources and how this was made',sourceCopy:'Based on Kim eungyeul’s design and the team’s public research plan v2. Official references below informed checks on federation, DP-SGD and dataset partitions. No new experimental results are published here.',toolsTitle:'How did people and AI build this page?',toolsCopy:'AI HUB supplied a storyboard; Gemini reviewed copy; WorkBuddy suggested implementation checks; Muse suggested a narrative; Canva generated an infographic draft. Codex selected suggestions, implemented and checked the interactions. Errors and exaggerated claims were not copied into the page.',logLink:'Read the trilingual production and change log',end:'Our goal is to investigate the trade-off between privacy and rare-class performance. Experiments must determine whether the ideas help.',research:'Read the full research plan ↗',edit:'Contribute on GitHub',unit:'Illustrative intensity'},
ko:{eyebrow:'주제 05 / 대중을 위한 인터랙티브 설명 / 약 3분',title:'데이터는 병원에 두고, AI는 함께 배울 수 있을까요?',lead:'여러 기관이 AI를 함께 학습할 때, 개인정보를 보호하면서 표본이 적은 클래스도 놓치지 않으려면 어떻게 해야 할까요?',notice:'연구 계획 · 효과 미검증. 점·노이즈·흐름은 모두 개념 설명용입니다. 실제 환자 데이터가 없으며 임상 도구가 아닙니다.',nav1:'① 함께 배우기',nav2:'② 문제 살펴보기',nav3:'③ 두 아이디어',nav4:'④ 검증 방법',flowTitle:'학습 업데이트를 공유하고, 원본 데이터는 로컬에',flowLead:'한 번의 연합학습 과정을 눌러 보세요. 가상 병원 세 곳은 설명용이며, 주 실험은 Fed-ISIC2019의 6개 클라이언트를 사용할 계획입니다.',concept:'개념 설명 · 실험 결과 아님',ha:'가상 병원 A',hb:'가상 병원 B',hc:'가상 병원 C',local:'▣ 원본 데이터는 로컬에',server:'조정 서버',back:'이전',next:'다음',reset:'처음부터',steps:['모델 배포','로컬 학습','업데이트 보호','업데이트 집계'],stepTitles:['현재 모델을 각 병원에 전달합니다','기록을 보내지 않고 각자 학습합니다','기록별 기여를 제한하고 노이즈를 더합니다','보호된 업데이트를 모아 다음 모델을 만듭니다'],stepCopies:['서버는 환자 기록이 아닌 모델 파라미터를 보냅니다.','각 클라이언트가 자신의 데이터로 학습합니다. 데이터 상자는 계속 병원에 남아 있습니다.','DP-SGD는 기록별 그래디언트 기여를 클리핑하고 노이즈를 더합니다. 그 결과의 업데이트를 서버로 보냅니다. 임의의 파일에 노이즈만 더한다고 DP가 되지는 않습니다.','서버는 프로토콜에 따라 업데이트를 집계하고 모델을 다시 배포합니다. 업데이트되었다고 반드시 정확도가 높아지는 것은 아닙니다. 실험으로 평가해야 합니다.'],packets:['모델 파라미터','로컬 학습 중','보호된 업데이트','다음 라운드 모델'],flowNote:'원본 데이터를 로컬에 두면 외부 전송을 줄일 수 있지만 업데이트에서도 정보가 드러날 수 있습니다. DP는 보호 단위·인접성·ε/δ 예산을 정한 조건에서 한 단위가 출력 분포에 미치는 영향을 제한하며 위험 0을 보장하지 않습니다.',noiseTitle:'같은 방해가 작은 목소리를 가릴까요?',noiseLead:'많은 원은 흔한 클래스, 적은 마름모는 희귀 클래스를 비유합니다. 슬라이더로 같은 시각적 방해를 조절해 보세요. 희귀 클래스가 더 큰 영향을 받는지는 검증할 연구 질문입니다.',slider:'설명용 노이즈 강도',low:'낮음',high:'높음',common:'● 흔한 클래스 · 많은 신호',rare:'◆ 희귀 클래스 · 적은 신호',commonLegend:'원은 상대적으로 많다는 뜻이며 환자 수가 아닙니다.',rareLegend:'마름모는 상대적으로 적다는 뜻이며 환자 수가 아닙니다.',noiseStates:['방해가 적어 두 그룹의 신호가 비교적 잘 보입니다.','같은 방해 아래에서 적은 마름모 신호는 구분하기 어려울 수 있습니다.','방해가 강해 두 그룹 모두 가려집니다. 실제 희귀 클래스 영향은 실험이 필요합니다.'],noiseNote:'슬라이더는 시각적 가림만 바꿉니다. DP 실행·모델 학습·정확도 계산을 하지 않으며 실제 ε에 대응하지 않습니다. 점 수와 강도, 가림 관계는 설명을 위한 설정입니다.',ideasTitle:'검증하려는 두 가지 아이디어',ideasLead:'공개된 지식에서 출발하고, 클래스별로 더 균형 있게 배우는 분류기를 탐색합니다. P1 또는 P2를 선택하세요.',unverified:'제안 방법 · 효과 미검증',methods:{P1:['P1 · 책 전체 대신 일부 장만 고치기','공개 사전학습 모델을 출발점으로 대부분의 파라미터를 고정하고, 선택 모듈 또는 저차원 파라미터와 분류기를 DP로 미세조정합니다. 학습 부담을 줄이려는 아이디어이며, 적은 파라미터가 더 좋은 결과를 자동 보장하지는 않습니다.'],P2:['P2 · 보호된 요약으로 클래스 균형 맞추기','P1에 더해 각 클라이언트가 클리핑·노이즈 처리한 클래스별 특성 합과 수를 공개합니다. 서버는 DP 요약으로 클래스마다 같은 수의 가상 특성을 만들어 분류기를 재학습합니다. 실제 환자 기록을 복사하거나 만들어 내는 과정이 아닙니다.']},parameterNote:'밝은색=고정, 진한색=조정. 블록 수와 비율은 실제 모델 크기가 아닌 설명용입니다.',summaryNote:'A / B / C는 가상 특성을 만드는 데 쓰는 DP 클래스 요약이며 환자 기록이 아닙니다.',budget:'최종 ε≤3: 계획 목표',effect:'희귀 클래스 개선: 검증 예정',budgetNote:'P2 통계 공개도 프라이버시 예산을 사용합니다. 모든 라운드와 공개를 합성하고 고정 δ에서 검증해야 합니다. 이 그림은 예산을 계산하거나 입증하지 않습니다.',evidenceTitle:'애니메이션 대신 실험으로 답합니다',questions:[['RQ1 · 차이가 실제로 있나요?','비DP와 DP 연합학습을 비교해 희귀 클래스의 성능 손실이 더 큰지 확인합니다.'],['RQ2 · 아이디어가 도움이 되나요?','동일한 최종 프라이버시 예산과 맞춘 조건에서 기준선·P1·P2를 비교하고 희귀·최악 클래스 재현율 등을 보고합니다.'],['RQ3 · 분포가 바뀌어도 유지되나요?','클라이언트별 클래스 분포를 바꾸고 반복 실행 및 실패 결과도 보존해 결론의 안정성을 확인합니다.']],recallTitle:'재현율이란 무엇인가요?',recall:'실제로 그 클래스에 속한 표본 중 모델이 올바르게 찾아낸 비율입니다. 전체 정확도만 보면 표본이 적은 클래스의 낮은 성능을 놓칠 수 있습니다.',rareTitle:'희귀 클래스는 임상적 희귀질환인가요?',rareNote:'반드시 같지는 않습니다. 여기서는 우선 데이터셋에서 표본이 적은 클래스를 뜻합니다. 주 실험은 공개 피부 병변 이미지의 연합 시뮬레이션이며 실제 병원 진단 성능을 입증하지 않습니다.',patientTitle:'환자 수준 프라이버시가 입증되었나요?',patientNote:'아닙니다. 이미지 수준 DP가 자동으로 환자 수준 DP가 되지는 않습니다. 환자 식별자·중복 이미지·클라이언트 간 중복을 감사하고 보호 단위와 회계를 검증해야 합니다.',quizTitle:'10초 확인',quiz:'데이터가 병원에 남으면 정보 유출이 불가능할까요?',quizA:'네, 완전히 안전합니다',quizB:'아니요, 업데이트도 보호해야 합니다',quizGood:'맞습니다. 연합학습은 원본 데이터 전송을 줄이지만 업데이트에서도 정보가 드러날 수 있습니다. 프라이버시 메커니즘·회계·검증이 필요합니다.',quizWrong:'한 단계 더 생각해 보세요. 기록이 로컬에 남아도 업데이트에 정보가 담길 수 있습니다. 원본 미전송이 위험 0을 뜻하지는 않습니다.',sourceTitle:'근거와 제작 설명',sourceCopy:'김은결의 설계서와 팀의 공개 연구 계획 v2를 바탕으로 작성했습니다. 아래 공식 자료로 연합학습·DP-SGD·데이터 분할을 확인했습니다. 새 실험 결과는 공개하지 않았습니다.',toolsTitle:'사람과 AI는 어떻게 함께 만들었나요?',toolsCopy:'AI HUB는 설명 순서, Gemini는 문안 검토, WorkBuddy는 구현 점검, Muse는 이야기 구성, Canva는 정보도 초안을 제공했습니다. Codex가 제안을 선별하고 인터랙션을 구현·검증했습니다. 오류나 과장된 주장은 그대로 옮기지 않았습니다.',logLink:'삼중언어 제작·변경 기록 보기',end:'목표는 프라이버시와 희귀 클래스 성능 사이의 균형을 연구하는 것입니다. 개선 여부는 실험으로 확인해야 합니다.',research:'전체 연구 계획 보기 ↗',edit:'GitHub에서 함께 수정',unit:'설명용 강도'}
};

for(const lang of Object.keys(progressUpdate))Object.assign(copy[lang],progressUpdate[lang]);
// shared data layer (data/medfl-data.js) overrides dated status lines and the round description
if(window.MEDFL_DATA)for(const lang of Object.keys(copy))Object.assign(copy[lang],MEDFL_DATA.pages.explain[lang]||{});

const state={lang:'ko',step:0,method:'P1',noise:40,quiz:null};
const requested=new URLSearchParams(location.search).get('lang');if(Object.hasOwn(copy,requested))state.lang=requested;
const $=id=>document.getElementById(id);
for(const [id,count] of [['commonDots',24],['rareDots',4]])for(let i=0;i<count;i++){const dot=document.createElement('i');dot.className='dot';$(id).append(dot);}
for(let i=0;i<48;i++){const block=document.createElement('i');if(i>41)block.className='active';$('parameters').append(block);}
function noiseRender(){const t=copy[state.lang];$('noiseValue').textContent=state.noise+'/100';$('noiseRange').value=state.noise;$('noiseRange').setAttribute('aria-valuetext',t.unit+' '+state.noise+'/100');document.documentElement.style.setProperty('--fog',.04+state.noise*.007);$('noiseMeaning').textContent=t.noiseStates[state.noise<30?0:state.noise<70?1:2];}
function stepRender(){const m=document.querySelector('[data-flr]');if(m&&window.MedFLDemo)MedFLDemo.round(m,state.lang);}
function methodRender(){const t=copy[state.lang];$('methodTitle').textContent=t.methods[state.method][0];$('methodCopy').textContent=t.methods[state.method][1];$('p1Visual').classList.toggle('hidden',state.method!=='P1');$('p2Visual').classList.toggle('hidden',state.method!=='P2');document.querySelectorAll('[data-method]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.method===state.method?'true':'false'));}
function quizRender(){const t=copy[state.lang];$('quizResult').classList.toggle('hidden',state.quiz===null);if(state.quiz!==null)$('quizResult').textContent=state.quiz?t.quizGood:t.quizWrong;}
function render(){const t=copy[state.lang];document.documentElement.lang=state.lang==='zh'?'zh-CN':state.lang;document.title='MedFL · '+t.title;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===state.lang?'true':'false'));const home=state.lang==='ko'?'index.html':state.lang+'.html';$('home').href=home;$('research').href=home;$('latestProgress').href='progress.html?lang='+state.lang;$('questions').replaceChildren();t.questions.forEach(([title,text])=>{const box=document.createElement('div');box.className='question';const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=text;box.append(h,p);$('questions').append(box);});stepRender();noiseRender();methodRender();quizRender();}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;const url=new URL(location.href);url.searchParams.set('lang',state.lang);history.replaceState(null,'',url);render();});
document.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{state.method=b.dataset.method;methodRender();});
